[project]
name = "job-search-agent"
version = "0.1.0"
description = "Deterministic, testable job-search pipeline: scout, digest, ATS scoring, resume truthfulness checks, human-in-the-loop submitter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yan Liang", email = "placeholder@example.com" }]
keywords = ["job-search", "ats", "job-scout", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# No third-party dependencies by design: stdlib only so the project runs anywhere.

[project.scripts]
jobagent = "jobagent.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
